aid: duckbill
name: Duckbill
description: >-
  Duckbill is an AI-plus-human task-completion service that executes the
  real-world errands people avoid: fighting refunds, disputes and billing
  errors, cancelling services, researching vendors and getting quotes, and
  booking appointments and reservations. It pairs AI planning with
  background-checked human "doers" who make the phone calls and handle the red
  tape, accepting requests by text, email, forwarded message, or app. Duckbill
  exposes this execution layer to AI agents through a hosted MCP (Model Context
  Protocol) server — "Connect to Claude" — plus platform API and CLI access, so
  developers can plug real human follow-through into any AI workflow. Backed by
  Forerunner Ventures, General Catalyst, and Uncork Capital.
